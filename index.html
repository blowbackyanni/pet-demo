<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pet Evacuation Demo</title>
<style>
body{
font-family: Arial;
background:#f4f7f6;

}
.container{

background:white;
padding:20px;
border-radius:10px;

}
h1{
color:#2e7d32;
}
.pet-card{

padding:10px;

}
.button{

color:white;
padding:8px 15px;

}

</head>

<body>

<div class="container">

<h1>ペット避難管理システム</h1>

<div class="pet-card">

</div>

</html>
